name: BM25 KL normalization experiment

on:
  push:
    branches:
      - research/bm25-kl-calibration-20260915

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn
      - name: Run corrected experiment
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, zipfile, json, csv, re, math, collections, tempfile
          from pathlib import Path
          import numpy as np
          from sklearn.metrics import roc_auc_score, average_precision_score
          from scipy.stats import spearmanr

          DATASETS = ['scifact', 'nfcorpus', 'arguana', 'fiqa']
          K, K1, B, SEED = 100, 1.2, 0.75, 20260915
          TOKEN_RE = re.compile(r'(?u)\b\w\w+\b')
          ALPHAS = [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]

          def tok(s):
              return TOKEN_RE.findall((s or '').lower())

          def load_beir(ds, root):
              url = f'https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/{ds}.zip'
              zp = root / f'{ds}.zip'
              urllib.request.urlretrieve(url, zp)
              with zipfile.ZipFile(zp) as z:
                  z.extractall(root)
              base = root / ds
              queries = {}
              with (base / 'queries.jsonl').open(encoding='utf8') as f:
                  for line in f:
                      x = json.loads(line); queries[str(x['_id'])] = x['text']
              qrels = collections.defaultdict(dict)
              with (base / 'qrels' / 'test.tsv').open(encoding='utf8') as f:
                  for row in csv.DictReader(f, delimiter='\t'):
                      if int(row['score']) > 0:
                          qrels[str(row['query-id'])][str(row['corpus-id'])] = int(row['score'])
              queries = {q:t for q,t in queries.items() if q in qrels}
              qtoks = {q:tok(t) for q,t in queries.items()}
              vocab = set(x for xs in qtoks.values() for x in xs)
              postings = {t:[] for t in vocab}; dls=[]; docids=[]
              with (base / 'corpus.jsonl').open(encoding='utf8') as f:
                  for i,line in enumerate(f):
                      x=json.loads(line); text=((x.get('title') or '')+' '+(x.get('text') or '')).strip()
                      ts=tok(text); dls.append(len(ts)); docids.append(str(x['_id']))
                      c=collections.Counter(t for t in ts if t in vocab)
                      for t,tf in c.items(): postings[t].append((i,tf))
              return docids, np.asarray(dls,dtype=np.float32), qtoks, qrels, postings

          def folds(qids):
              q=np.array(list(qids),dtype=object); rng=np.random.default_rng(SEED); rng.shuffle(q)
              return [set(x.tolist()) for x in np.array_split(q,5)]

          def threshold(scores,target):
              a=np.sort(np.asarray(scores,float))[::-1]
              if len(a)==0: return math.inf
              return float(a[min(len(a)-1,max(0,math.ceil(target*len(a))-1))])

          def safe_auc(y,s):
              return float(roc_auc_score(y,s)) if len(set(map(int,y)))>1 else None

          def safe_rho(x,y):
              if len(set(map(float,x)))<2 or len(set(map(float,y)))<2: return None
              z=spearmanr(x,y).statistic
              return None if np.isnan(z) else float(z)

          def eval_dataset(ds,root):
              docids,dls,qtoks,qrels,postings=load_beir(ds,root); N=len(docids); avgdl=float(dls.mean())
              arrpost={}; idf={}
              for t,p in postings.items():
                  idx=np.fromiter((z[0] for z in p),dtype=np.int32,count=len(p))
                  tf=np.fromiter((z[1] for z in p),dtype=np.float32,count=len(p))
                  arrpost[t]=(idx,tf); df=len(p)
                  idf[t]=math.log(1.0+(N-df+0.5)/(df+0.5))

              rows=[]; tops=[]; total_rel=sum(len(v) for v in qrels.values()); base_rel=0; base_success=0; no_match=0; candidate_counts=[]
              for qid,ts in qtoks.items():
                  scores=np.zeros(N,dtype=np.float32)
                  for t in ts:
                      if t not in arrpost: continue
                      idx,tf=arrpost[t]; den=tf+K1*(1-B+B*dls[idx]/avgdl)
                      scores[idx]+=idf[t]*tf*(K1+1)/den
                  pos=np.flatnonzero(scores>0)
                  qlen=max(1,len(ts)); known=max(1,sum(1 for t in ts if t in idf)); sumidf=sum(idf.get(t,0.0) for t in ts); ceiling=max(1e-12,(K1+1)*sumidf)
                  if len(pos)==0:
                      no_match+=1
                      tops.append({'qid':qid,'label':0,'raw':0.0,'paper_kl':0.0,'known_kl':0.0,'ceiling_ratio':0.0,'qlen':qlen,'known':known,'sumidf':sumidf})
                      continue
                  if len(pos)>K:
                      pick=np.argpartition(scores[pos],-K)[-K:]; inds=pos[pick]
                  else:
                      inds=pos
                  inds=inds[np.argsort(scores[inds])[::-1]]; candidate_counts.append(len(inds))
                  relset=qrels[qid]; flags=np.fromiter((1 if docids[i] in relset else 0 for i in inds),dtype=np.int8,count=len(inds))
                  nr=int(flags.sum()); base_rel+=nr; base_success+=int(nr>0)
                  top_raw=float(scores[inds[0]])
                  tops.append({'qid':qid,'label':int(flags[0]),'raw':top_raw,'paper_kl':top_raw/(qlen*(K1+1)),'known_kl':top_raw/(known*(K1+1)),'ceiling_ratio':top_raw/ceiling,'qlen':qlen,'known':known,'sumidf':sumidf})
                  for rank,(i,rel) in enumerate(zip(inds,flags),1):
                      raw=float(scores[i])
                      rows.append({'qid':qid,'rank':rank,'rel':int(rel),'raw':raw,'paper_kl':raw/(qlen*(K1+1)),'known_kl':raw/(known*(K1+1)),'ceiling_ratio':raw/ceiling,'top_ratio':raw/top_raw,'qlen':qlen})

              variants=['raw','paper_kl','known_kl','ceiling_ratio']
              top={}; y=np.array([x['label'] for x in tops],int)
              for n in variants:
                  s=np.array([x[n] for x in tops],float)
                  top[n]={'auc':safe_auc(y,s),'ap':float(average_precision_score(y,s)) if y.sum()>0 else None,'rho_qlen':safe_rho(s,[x['qlen'] for x in tops]),'rho_sumidf':safe_rho(s,[x['sumidf'] for x in tops])}

              fs=folds(qtoks.keys()); gate={}; alpha_gate={}
              for target in (0.95,0.99):
                  gate[str(target)]={}
                  for n in ['raw','paper_kl','known_kl','ceiling_ratio','top_ratio']:
                      vals=[]
                      for testq in fs:
                          tr=[r for r in rows if r['qid'] not in testq]; te=[r for r in rows if r['qid'] in testq]
                          th=threshold([r[n] for r in tr if r['rel']],target); keep=[r for r in te if r[n]>=th]
                          rt=sum(r['rel'] for r in te); rk=sum(r['rel'] for r in keep)
                          sq={r['qid'] for r in te if r['rel']}; sk={r['qid'] for r in keep if r['rel']}
                          vals.append((rk/max(1,rt),len(keep)/max(1,len(te)),len(sk)/max(1,len(sq)),th))
                      gate[str(target)][n]={'recall':float(np.mean([v[0] for v in vals])),'recall_std':float(np.std([v[0] for v in vals])),'retained':float(np.mean([v[1] for v in vals])),'retained_std':float(np.std([v[1] for v in vals])),'success':float(np.mean([v[2] for v in vals]))}
                  alpha_gate[str(target)]={}
                  for a in ALPHAS:
                      vals=[]
                      for testq in fs:
                          tr=[r for r in rows if r['qid'] not in testq]; te=[r for r in rows if r['qid'] in testq]
                          trrel=[r['raw']/(r['qlen']**a) for r in tr if r['rel']]; th=threshold(trrel,target)
                          keep=[r for r in te if r['raw']/(r['qlen']**a)>=th]
                          rt=sum(r['rel'] for r in te); rk=sum(r['rel'] for r in keep); sq={r['qid'] for r in te if r['rel']}; sk={r['qid'] for r in keep if r['rel']}
                          vals.append((rk/max(1,rt),len(keep)/max(1,len(te)),len(sk)/max(1,len(sq))))
                      alpha_gate[str(target)][str(a)]={'recall':float(np.mean([v[0] for v in vals])),'retained':float(np.mean([v[1] for v in vals])),'success':float(np.mean([v[2] for v in vals]))}

              return {'dataset':ds,'docs':N,'queries':len(qtoks),'qrels':total_rel,'no_match_queries':no_match,'mean_candidates':float(np.mean(candidate_counts)) if candidate_counts else 0.0,'baseline_abs_recall_at_100':base_rel/max(1,total_rel),'baseline_query_success_at_100':base_success/max(1,len(qtoks)),'top_metrics':top,'gate':gate,'alpha_gate':alpha_gate}

          def f(x): return 'NA' if x is None else f'{x:.3f}'
          def report(rs):
              o=['# Corrected BM25 KL-normalization experiment','',f'Positive-score candidates only; k1={K1}, b={B}, topK={K}; 5-fold query CV; seed={SEED}.','']
              o+=['## Baseline','', '| dataset | docs | queries | qrels | no-match q | mean candidates | recall@100 | query success@100 |','|---|---:|---:|---:|---:|---:|---:|---:|']
              for r in rs:o.append(f"| {r['dataset']} | {r['docs']} | {r['queries']} | {r['qrels']} | {r['no_match_queries']} | {r['mean_candidates']:.1f} | {r['baseline_abs_recall_at_100']:.3f} | {r['baseline_query_success_at_100']:.3f} |")
              o+=['','## Top-1 cross-query confidence','', '| dataset | score | AUROC | AP | rho(q length) | rho(sum IDF) |','|---|---|---:|---:|---:|---:|']
              for r in rs:
                  for n,m in r['top_metrics'].items():o.append(f"| {r['dataset']} | {n} | {f(m['auc'])} | {f(m['ap'])} | {f(m['rho_qlen'])} | {f(m['rho_sumidf'])} |")
              for t in ('0.95','0.99'):
                  o+=['',f'## Held-out global gating (train target={t})','', '| dataset | score | held recall | retained | query-success survival |','|---|---|---:|---:|---:|']
                  for r in rs:
                      for n,m in r['gate'][t].items():o.append(f"| {r['dataset']} | {n} | {m['recall']:.3f}±{m['recall_std']:.3f} | {m['retained']:.3f}±{m['retained_std']:.3f} | {m['success']:.3f} |")
                  o+=['',f'### Fixed exponent sweep: BM25 / |q|^alpha ({t})','', '| dataset | alpha | held recall | retained | survival |','|---|---:|---:|---:|---:|']
                  for r in rs:
                      for a,m in r['alpha_gate'][t].items():o.append(f"| {r['dataset']} | {a} | {m['recall']:.3f} | {m['retained']:.3f} | {m['success']:.3f} |")
              o+=['','Definitions:','- `paper_kl = BM25 / (|q| * (k1+1))`: exactly the paper normalization; for fixed k1 it differs from `BM25/|q|` by one global constant.','- `known_kl`: same but divides by query terms present somewhere in the corpus, not all query tokens.','- `ceiling_ratio = BM25 / ((k1+1)*sum(query IDF))`.','- `top_ratio = score/top_score(query)`; only used for candidate gating.','- Gating recall is relative to qrel-positive documents already retrieved in the positive-score BM25 candidate set.']
              return '\n'.join(o)+'\n'

          with tempfile.TemporaryDirectory() as td:
              root=Path(td); rs=[]
              for ds in DATASETS:
                  print('===',ds,'===',flush=True); r=eval_dataset(ds,root); rs.append(r); print(json.dumps(r,sort_keys=True),flush=True)
          Path('bm25-kl-results.json').write_text(json.dumps(rs,indent=2,sort_keys=True),encoding='utf8')
          rep=report(rs); Path('bm25-kl-report.md').write_text(rep,encoding='utf8'); print(rep,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bm25-kl-results-corrected
          path: |
            bm25-kl-results.json
            bm25-kl-report.md
          if-no-files-found: warn
