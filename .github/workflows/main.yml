name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tooling and tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint/fmt are canary-only for now; pin the first stable release
          # that ships them when it lands.
          bun-version: canary
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - name: Check for unused exports
        run: pnpm knip
      - run: pnpm build
      - name: Verify published package contents
        run: node scripts/verify-npm-pack.cjs
      - run: pnpm coverage
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-bundles
          path: dist/
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  runtime:
    name: Package compatibility (Node ${{ matrix.node-version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.0.0', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: runtime-bundles
          path: dist/
      - run: make test-runtime
      - run: node scripts/assert-public-bundles.cjs
      - run: node scripts/assert-browser-bundle.cjs
